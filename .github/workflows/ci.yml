name: Trader Pull Request CI

on:
  push:
    branches: [main]
    paths:
      - "trader/**"
      - "tests/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "trader/**"
      - "tests/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: trader-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
