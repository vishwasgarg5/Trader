name: NIFTY 50 Wayback digest diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/nifty50-wayback-acquisition-2026-11-08
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pytest
      - name: Run diagnostic unit tests
        run: python -m pytest -q tests/test_diagnose_wayback_nifty50_digest_mismatches.py
      - name: Re-fetch and diagnose quarantined captures
        run: python scripts/diagnose_wayback_nifty50_digest_mismatches.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty50-wayback-digest-diagnostics
          path: data/reports/nifty50_wayback_digest_diagnostics.json
          if-no-files-found: warn
          retention-days: 90
