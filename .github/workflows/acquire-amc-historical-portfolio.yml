name: Acquire AMC historical portfolio snapshot

on:
  workflow_dispatch:
    inputs:
      approved_design_commit_sha:
        description: "Exact 40-character commit SHA reviewed and approved by a human"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: amc-historical-portfolio-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate approved design SHA
        env:
          APPROVED_SHA: ${{ inputs.approved_design_commit_sha }}
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, re, sys
          approved = os.environ["APPROVED_SHA"]
          checked_out = os.environ["CHECKED_OUT_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", approved):
              raise SystemExit("approved_design_commit_sha must be a full 40-character SHA")
          if approved != checked_out:
              raise SystemExit("Dispatch SHA must exactly match the workflow commit SHA")
          PY
      - name: Checkout the exact reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_design_commit_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Discover and acquire original AMC bytes
        run: python scripts/acquire_amc_historical_portfolio.py
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amc-acquisition-diagnostics-${{ github.run_id }}
          path: acquisition-output/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit original bytes and provenance when acquired
        if: success()
        run: |
          if [ -f acquisition-output/acquisition_result.json ] && grep -q '"status": "ACQUIRED"' acquisition-output/acquisition_result.json; then
            mkdir -p data/raw/amc_snapshots/2024-12/motilal-oswal-nifty-50-index-fund
            cp acquisition-output/*.xlsx data/raw/amc_snapshots/2024-12/motilal-oswal-nifty-50-index-fund/ 2>/dev/null || true
            cp acquisition-output/*.xls data/raw/amc_snapshots/2024-12/motilal-oswal-nifty-50-index-fund/ 2>/dev/null || true
            cp acquisition-output/acquisition_result.json data/raw/amc_snapshots/2024-12/motilal-oswal-nifty-50-index-fund/provenance.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/raw/amc_snapshots/2024-12/motilal-oswal-nifty-50-index-fund/
            if ! git diff --cached --quiet; then
              git commit -m "Acquire original Motilal Oswal Dec 2024 Nifty 50 portfolio"
              git push
            fi
          else
            echo "No verified December 2024 Nifty 50 AMC workbook acquired; no evidence files committed."
          fi
