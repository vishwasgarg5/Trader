name: Archive NSE ad-hoc closure circulars

on:
  push:
    branches: [main]
    paths:
      - "scripts/archive_nse_ad_hoc_holiday_circulars.py"
      - ".github/workflows/archive-nse-ad-hoc-holidays.yml"
      - "data/reference/nifty50_tri_ad_hoc_closures.csv"
  workflow_dispatch:

concurrency:
  group: nse-ad-hoc-holiday-archive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  archive-ad-hoc-closures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download ad-hoc NSE closure circulars
        run: python scripts/archive_nse_ad_hoc_holiday_circulars.py
      - name: Persist available PDFs and manifest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/reference/source_documents/nse_ad_hoc_holiday_circulars data/reports/nifty50_tri_ad_hoc_closure_archive.json
          if git diff --cached --quiet; then
            echo "No ad-hoc archive changes"
          else
            git commit -m "Archive NSE ad-hoc and revised holiday circulars"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Require all three circulars
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          path = Path("data/reports/nifty50_tri_ad_hoc_closure_archive.json")
          if not path.exists():
              sys.exit("ad-hoc archive manifest missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          print({"archived_count": report.get("archived_count"), "failures": report.get("failures")})
          sys.exit(0 if report.get("archived_count") == 3 and not report.get("failures") else 1)
          PY
