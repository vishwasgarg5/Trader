name: Daily Trader Signals

on:
  push:
    branches: [main]
    paths:
      - "trader/**"
      - "tests/**"
      - "config/**"
      - "data/reference/**"
      - "requirements.txt"
      - ".github/workflows/daily.yml"
  schedule:
    - cron: "20 10 * * 1-5" # 15:50 IST, after NSE cash-market close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-trader
  cancel-in-progress: false

jobs:
  build-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Generate signals and evaluate model
        run: python -m trader.pipeline
      - name: Run fail-closed operational and drift monitoring
        if: always()
        run: python -m trader.monitoring
      - name: Upload data integrity and monitoring diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trader-monitoring-reports-${{ github.run_id }}
          path: |
            data/reports/data_integrity.json
            data/reports/monitoring.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Commit model and reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Generated model binaries and JSON reports cannot be meaningfully
          # line-merged. If main moved during this run, regenerate from the
          # latest main instead of rebasing stale artifacts onto it.
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "main advanced; rebuilding generated outputs on latest main (attempt ${attempt})"
              git reset --hard origin/main
              python -m trader.pipeline
            fi

            git add data models
            if git diff --cached --quiet; then
              echo "No generated changes to commit"
              exit 0
            fi

            git commit -m "chore: refresh daily swing signals and model"
            if git push origin HEAD:main; then
              echo "Generated outputs pushed successfully"
              exit 0
            fi

            echo "Push raced with another main update; retrying from latest main"
            git reset --hard origin/main
          done

          echo "Unable to publish generated outputs after 3 attempts"
          exit 1
