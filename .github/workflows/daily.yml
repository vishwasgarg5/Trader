name: Daily Trader Signals

on:
  push:
    branches: [main]
    paths:
      - "trader/**"
      - "tests/**"
      - "config/**"
      - "data/reference/**"
      - "requirements.txt"
      - ".github/workflows/daily.yml"
  schedule:
    - cron: "20 10 * * 1-5" # 15:50 IST, after NSE cash-market close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-trader
  cancel-in-progress: false

jobs:
  build-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Generate signals and evaluate model
        run: python -m trader.pipeline
      - name: Upload data integrity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-integrity-report-${{ github.run_id }}
          path: data/reports/data_integrity.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit model and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh daily swing signals and model"
            # Rebase generated outputs onto the latest main; never force-push.
            git pull --rebase origin main
            git push
          else
            echo "No generated changes to commit"
          fi
