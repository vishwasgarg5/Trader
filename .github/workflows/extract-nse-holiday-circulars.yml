name: Extract NSE holiday circular candidates

on:
  push:
    branches: [main]
    paths:
      - "scripts/extract_nse_holiday_circulars.py"
      - ".github/workflows/extract-nse-holiday-circulars.yml"
      - "data/reference/source_documents/nse_holiday_circulars/**"
      - "data/reports/nifty50_tri_holiday_circular_archive.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-holiday-candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install PDF text extractor
        run: python -m pip install "pypdf>=5,<7"
      - name: Extract text and candidate dates
        run: python scripts/extract_nse_holiday_circulars.py
      - name: Persist extraction artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/reports/nifty50_tri_holiday_extraction.json data/reference/extracted_text/nse_holiday_circulars
          if git diff --cached --quiet; then
            echo "No extraction artifacts changed"
          else
            git commit -m "Extract NSE holiday circular review candidates"
            git push origin HEAD:main
          fi
      - name: Require all seven source years extracted
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          path = Path("data/reports/nifty50_tri_holiday_extraction.json")
          if not path.exists():
              sys.exit("extraction report missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          expected = list(range(2018, 2025))
          actual = sorted(report.get("extracted_years", []))
          print({"extracted_years": actual, "expected_years": expected, "errors": report.get("errors", [])})
          sys.exit(0 if actual == expected and not report.get("errors") else 1)
          PY
