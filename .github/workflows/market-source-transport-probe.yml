name: Market source transport probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-source-transport-probe.yml"
      - "scripts/market_source_transport_probe.py"

permissions:
  contents: read

concurrency:
  group: market-source-transport-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install probe clients
        run: |
          python -m pip install --disable-pip-version-check requests curl_cffi
      - name: Probe DNS TCP TLS and HTTP transports
        run: python scripts/market_source_transport_probe.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-source-transport-probe
          path: data/reports/market_source_transport_probe.json
          if-no-files-found: warn
          retention-days: 30
