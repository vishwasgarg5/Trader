name: Python Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "trader/**"
      - "scripts/**"
      - "tests/**"
      - "config/nifty50_pilot_protocol.json"
      - "requirements.txt"
      - ".github/workflows/python-tests.yml"

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

  wayback-replay:
    name: NIFTY 50 Wayback candidate replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out proposed PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect acquisition-related changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed-files.txt
          if grep -Eq '^(scripts/nse_curl_cffi_retry.py|tests/test_nse_curl_cffi_retry.py|data/reports/weekly_market_document_(acquisition|refresh).json)$' /tmp/changed-files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install acquisition clients and test runner
        if: steps.scope.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check pytest requests curl_cffi

      - name: Run acquisition safeguard tests
        if: steps.scope.outputs.run == 'true'
        run: python -m pytest -q tests/test_nse_curl_cffi_retry.py

      - name: Replay official PDF retries and Wayback CDX candidates
        if: steps.scope.outputs.run == 'true'
        run: python scripts/nse_curl_cffi_retry.py

      - name: Upload candidate snapshots and acquisition reports
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nifty50-wayback-replay-pr-${{ github.event.pull_request.number }}
          path: |
            data/reference/source_documents/wayback_nifty50_snapshots/
            data/reference/wayback_cdx/
            data/reports/nse_curl_cffi_retry.json
            data/reports/wayback_cdx_ingestion.json
          if-no-files-found: warn
          retention-days: 30
