name: Triple Barrier Research Experiment

on:
  push:
    branches: [feature/triple-barrier-walk-forward, feature/p3-rankic-sector-risk-controls]
    paths:
      - "trader/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/triple-barrier-experiment.yml"
  pull_request:
    branches: [main, feature/p1-p2-data-portfolio-validation]
    paths:
      - "trader/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/triple-barrier-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: triple-barrier-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore cached NSE delivery history
        uses: actions/cache@v4
        with:
          path: |
            data/raw/delivery.csv
            data/raw/delivery_download_log.csv
          key: nse-delivery-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nse-delivery-${{ runner.os }}-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run triple-barrier walk-forward experiment
        run: python -m trader.experiment
      - name: Upload experiment report
        uses: actions/upload-artifact@v4
        with:
          name: triple-barrier-experiment-report
          path: |
            data/reports/triple_barrier_experiment.json
            data/raw/delivery.csv
            data/raw/delivery_download_log.csv
          if-no-files-found: error
