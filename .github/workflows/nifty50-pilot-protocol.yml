name: Nifty 50 pilot protocol checks

on:
  push:
    branches: [main]
    paths:
      - "config/nifty50_pilot_protocol.json"
      - "config/schemas/nifty50_pilot_protocol.schema.json"
      - "trader/pilot_protocol.py"
      - "tests/test_nifty50_pilot_protocol.py"
      - "trader/nifty50_pit_readiness.py"
      - "trader/nifty_notice_reconciliation.py"
      - "trader/nifty50_notice_triage.py"
      - "tests/test_nifty50_notice_triage.py"
      - "docs/nifty50-notice-triage-rubric.md"
      - "tests/test_nifty_notice_reconciliation.py"
      - "data/reference/source_documents/**"
      - "data/reference/extracted_notice_text/**"
      - "data/reference/ocr_notice_text/**"
      - "tests/test_nifty50_pit_readiness.py"
      - "trader/nifty50_price_data_readiness.py"
      - "tests/test_nifty50_price_data_readiness.py"
      - "trader/pilot_execution.py"
      - "trader/nifty50_pilot_labels.py"
      - "tests/test_nifty50_pilot_labels.py"
      - "docs/nifty50-pilot-step-6-labels.md"
      - "trader/nifty50_pilot_controls.py"
      - "tests/test_nifty50_pilot_controls.py"
      - "tests/test_pilot_execution.py"
      - "docs/nifty50-pilot-step-5-execution.md"
      - "trader/security_aliases.py"
      - "trader/nifty50_index_reconstruction.py"
      - "tests/test_nifty50_index_reconstruction.py"
      - "docs/nifty50-index-reconstruction.md"
      - "tests/test_security_aliases.py"
      - "tests/test_corporate_actions.py"
      - "tests/test_nifty50_transition_register.py"
      - "tests/test_membership_evidence.py"
      - "tests/test_membership_interval_semantics.py"
      - "tests/test_special_membership_evidence.py"
      - "tests/test_live_special_membership_ledger.py"
      - "tests/test_membership_application.py"
      - "trader/corporate_actions.py"
      - "data/reference/nifty50_pilot_ohlcv.csv"
      - "data/reference/nifty50_tri.csv"
      - "data/reference/security_symbol_aliases.csv"
      - "data/reference/corporate_actions.csv"
      - "trader/membership_evidence.py"
      - "data/reference/nifty50_*.csv"
      - ".github/workflows/nifty50-pilot-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate JSON syntax
        run: |
          python -m json.tool config/nifty50_pilot_protocol.json > /dev/null
          python -m json.tool config/schemas/nifty50_pilot_protocol.schema.json > /dev/null
      - name: Install test runner and schema validator
        run: python -m pip install --disable-pip-version-check pytest jsonschema pandas numpy
      - name: Validate protocol against JSON Schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          with open('config/schemas/nifty50_pilot_protocol.schema.json', encoding='utf-8') as f:
              schema = json.load(f)
          with open('config/nifty50_pilot_protocol.json', encoding='utf-8') as f:
              protocol = json.load(f)
          Draft202012Validator(schema).validate(protocol)
          PY
      - name: Run protocol safety tests
        run: python -m pytest -q tests/test_nifty50_pilot_protocol.py
      - name: Run protocol validator
        run: python -m trader.pilot_protocol
      - name: Test membership evidence and interval semantics
        run: python -m pytest -q tests/test_membership_evidence.py tests/test_membership_interval_semantics.py tests/test_membership_application.py tests/test_special_membership_evidence.py tests/test_live_special_membership_ledger.py
      - name: Test PIT membership readiness accounting
        run: python -m pytest -q tests/test_nifty50_pit_readiness.py tests/test_nifty50_transition_register.py
      - name: Test security identity and corporate-action evidence
        run: python -m pytest -q tests/test_security_aliases.py tests/test_corporate_actions.py
      - name: Test synthetic Nifty 50 price-index reconstruction
        run: python -m pytest -q tests/test_nifty50_index_reconstruction.py
      - name: Run point-in-time membership readiness audit (expected fail-closed until evidence is complete)
        run: |
          set +e
          python -m trader.nifty50_pit_readiness > "${{ runner.temp }}/nifty50-pit-readiness.json"
          status=$?
          set -e
          cat "${{ runner.temp }}/nifty50-pit-readiness.json"
          if [ "$status" -eq 0 ]; then
            echo "PIT membership evidence is structurally complete; independent review remains separately required."
          elif [ "$status" -eq 1 ]; then
            echo "PIT membership correctly remains blocked by recorded evidence gaps."
          else
            exit "$status"
          fi

      - name: Test conservative Nifty 50 notice triage
        run: python -m pytest -q tests/test_nifty50_notice_triage.py
      - name: Build Nifty 50 notice triage queue (diagnostic only)
        run: python -m trader.nifty50_notice_triage
      - name: Test NSE source archive reconciliation
        run: python -m pytest -q tests/test_nifty_notice_reconciliation.py
      - name: Reconcile archived NSE notice sources (diagnostic; never writes membership)
        run: python -m trader.nifty_notice_reconciliation
      - name: Run price and benchmark data contract tests
        run: python -m pytest -q tests/test_nifty50_price_data_readiness.py
      - name: Run pilot execution constraint tests
        run: python -m pytest -q tests/test_pilot_execution.py
      - name: Test Nifty 50 pilot fixed-horizon label contract (synthetic only)
        run: python -m pytest -q tests/test_nifty50_pilot_labels.py
      - name: Test Nifty 50 pilot PIT features, power, purged folds and fail-closed gates (synthetic only)
        run: python -m pytest -q tests/test_nifty50_pilot_controls.py tests/test_portfolio.py tests/test_portfolio_diagnostics.py
      - name: Run price and benchmark readiness audit (expected fail-closed until source evidence is complete)
        run: |
          set +e
          python -m trader.nifty50_price_data_readiness > "${{ runner.temp }}/nifty50-price-data-readiness.json"
          status=$?
          set -e
          cat "${{ runner.temp }}/nifty50-price-data-readiness.json"
          if [ "$status" -eq 0 ]; then
            echo "Price and TRI data gates are structurally ready; independent source validation remains separately required."
          elif [ "$status" -eq 1 ]; then
            echo "Price and TRI research correctly remains blocked by missing or unverified evidence."
          else
            exit "$status"
          fi
