name: Weekly NSE and BSE market-document discovery

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-market-document-refresh.yml"
      - "scripts/weekly_market_document_refresh.py"
      - "scripts/weekly_market_document_acquisition.py"
      - "scripts/weekly_market_frontend_asset_audit.py"
      - "tests/test_weekly_market_document_refresh.py"
      - "tests/test_weekly_market_document_acquisition.py"
      - "tests/test_weekly_market_frontend_asset_audit.py"

permissions:
  contents: write

concurrency:
  group: weekly-market-document-discovery
  cancel-in-progress: false

jobs:
  discover-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest curl_cffi
      - name: Test discovery and evidence safeguards
        run: |
          python -m pytest -q tests/test_weekly_market_document_refresh.py tests/test_weekly_market_document_acquisition.py tests/test_weekly_market_frontend_asset_audit.py
      - name: Acquire official NSE and BSE landing-page snapshots
        run: |
          python scripts/weekly_market_document_refresh.py
      - name: Inspect observed official NSE filing frontend assets
        run: |
          python scripts/weekly_market_frontend_asset_audit.py
      - name: Acquire allowlisted primary-source PDF documents
        run: |
          python scripts/weekly_market_document_acquisition.py
      - name: Commit weekly source snapshots and report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/reference/source_documents data/reports
          if git diff --cached --quiet; then
            echo "No new source snapshots, documents, or reports"
          else
            git commit -m "Refresh weekly NSE and BSE market documents"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
