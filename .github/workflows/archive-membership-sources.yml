name: Archive Nifty 50 primary membership sources

on:
  push:
    branches: [main]
    paths:
      - "data/reference/nifty50_special_membership_events.csv"
      - "data/reference/nifty50_transition_register.csv"
      - "data/reference/nifty50_annual_notice_inventory.csv"
      - ".github/workflows/archive-membership-sources.yml"
      - "tests/test_experiment.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: membership-source-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download, validate, archive and hash primary PDFs
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import pathlib
          import urllib.parse
          import urllib.request

          ledger = pathlib.Path("data/reference/nifty50_special_membership_events.csv")
          allowed_hosts = {
              "nsearchives.nseindia.com",
              "www.niftyindices.com",
              "niftyindices.com",
              "archives.nseindia.com",
          }

          with ledger.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames
              rows = list(reader)

          required = {"event_id", "source_url", "source_document_path", "source_sha256"}
          if not required.issubset(fieldnames or []):
              raise SystemExit(f"Ledger missing required columns: {sorted(required - set(fieldnames or []))}")

          changed = False
          for row in rows:
              event_id = row["event_id"].strip()
              url = row["source_url"].strip()
              parsed = urllib.parse.urlparse(url)
              if parsed.scheme != "https" or parsed.hostname not in allowed_hosts:
                  raise SystemExit(f"Refusing non-approved source URL for {event_id}: {url}")
              request = urllib.request.Request(url, headers={"User-Agent": "TraderResearchEvidenceArchiver/1.0"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  final = urllib.parse.urlparse(response.geturl())
                  if final.scheme != "https" or final.hostname not in allowed_hosts:
                      raise SystemExit(f"Unexpected redirect host for {event_id}: {response.geturl()}")
                  data = response.read(25 * 1024 * 1024 + 1)
              if len(data) > 25 * 1024 * 1024:
                  raise SystemExit(f"PDF exceeds 25 MiB limit: {event_id}")
              if not data.startswith(b"%PDF-"):
                  raise SystemExit(f"Source is not a PDF: {event_id} ({url})")
              digest = hashlib.sha256(data).hexdigest()
              relative = f"data/reference/source_documents/{event_id}.pdf"
              target = pathlib.Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              if not target.exists() or target.read_bytes() != data:
                  target.write_bytes(data)
                  changed = True
              if row["source_document_path"] != relative or row["source_sha256"] != digest:
                  row["source_document_path"] = relative
                  row["source_sha256"] = digest
                  changed = True
              print(f"{event_id}: archived {len(data)} bytes sha256={digest}")

          # Archive the transition-register source PDFs too. Multiple rows can
          # reference one official notice, so content is stored once per URL.
          transition_ledger = pathlib.Path("data/reference/nifty50_transition_register.csv")
          with transition_ledger.open(newline="", encoding="utf-8") as handle:
              transition_reader = csv.DictReader(handle)
              transition_fields = transition_reader.fieldnames
              transition_rows = list(transition_reader)

          for row in transition_rows:
              for url_field, path_field, digest_field in (
                  ("source_url", "source_document_path", "source_sha256"),
                  ("superseding_notice_url", "superseding_document_path", "superseding_sha256"),
              ):
                  url = (row.get(url_field) or "").strip()
                  if not url:
                      continue
                  parsed = urllib.parse.urlparse(url)
                  if parsed.scheme != "https" or parsed.hostname not in allowed_hosts:
                      raise SystemExit(f"Refusing non-approved transition source URL: {url}")
                  request = urllib.request.Request(url, headers={"User-Agent": "TraderResearchEvidenceArchiver/1.0"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      final = urllib.parse.urlparse(response.geturl())
                      if final.scheme != "https" or final.hostname not in allowed_hosts:
                          raise SystemExit(f"Unexpected redirect host: {response.geturl()}")
                      data = response.read(25 * 1024 * 1024 + 1)
                  if len(data) > 25 * 1024 * 1024 or not data.startswith(b"%PDF-"):
                      raise SystemExit(f"Invalid or oversized PDF for {row['transition_id']}: {url}")
                  digest = hashlib.sha256(data).hexdigest()
                  relative = f"data/reference/source_documents/NSE-{hashlib.sha256(url.encode()).hexdigest()[:16]}.pdf"
                  target = pathlib.Path(relative)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if not target.exists() or target.read_bytes() != data:
                      target.write_bytes(data)
                      changed = True
                  if row.get(path_field, "") != relative or row.get(digest_field, "") != digest:
                      row[path_field] = relative
                      row[digest_field] = digest
                      changed = True
                  print(f"{row['transition_id']} {url_field}: archived {len(data)} bytes sha256={digest}")

          # Archive the annual notice inventory as a separate source register.
          notice_inventory = pathlib.Path("data/reference/nifty50_annual_notice_inventory.csv")
          with notice_inventory.open(newline="", encoding="utf-8") as handle:
              notice_reader = csv.DictReader(handle)
              notice_fields = notice_reader.fieldnames
              notice_rows = list(notice_reader)

          required_notice_fields = {
              "notice_id", "year", "announcement_date", "effective_date",
              "source_role", "source_url", "observed_nifty50_effect",
              "source_document_path", "source_sha256", "review_status", "notes",
          }
          if not required_notice_fields.issubset(notice_fields or []):
              raise SystemExit(
                  f"Annual notice inventory missing columns: "
                  f"{sorted(required_notice_fields - set(notice_fields or []))}"
              )
          with notice_inventory.open(newline="", encoding="utf-8") as handle:
              for line_number, raw_row in enumerate(csv.reader(handle), start=1):
                  if len(raw_row) != len(notice_fields or []):
                      raise SystemExit(
                          f"Annual notice inventory CSV width error on line {line_number}: "
                          f"expected {len(notice_fields or [])}, got {len(raw_row)}"
                      )
          for row in notice_rows:
              effect = (row.get("observed_nifty50_effect") or "").strip()
              digest = (row.get("source_sha256") or "").strip()
              if not effect or effect.startswith("data/"):
                  raise SystemExit(
                      f"Annual notice inventory has invalid observed_nifty50_effect: {row['notice_id']}"
                  )
              if len(digest) != 64 or any(ch not in "0123456789abcdef" for ch in digest.lower()):
                  raise SystemExit(
                      f"Annual notice inventory has invalid SHA-256: {row['notice_id']}"
                  )
              if not (row.get("source_document_path") or "").startswith("data/reference/source_documents/"):
                  raise SystemExit(
                      f"Annual notice inventory has invalid source_document_path: {row['notice_id']}"
                  )

          for row in notice_rows:
              notice_id = row["notice_id"].strip()
              url = row["source_url"].strip()
              parsed = urllib.parse.urlparse(url)
              if parsed.scheme != "https" or parsed.hostname not in allowed_hosts:
                  raise SystemExit(f"Refusing non-approved annual notice URL for {notice_id}: {url}")
              request = urllib.request.Request(url, headers={"User-Agent": "TraderResearchEvidenceArchiver/1.0"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  final = urllib.parse.urlparse(response.geturl())
                  if final.scheme != "https" or final.hostname not in allowed_hosts:
                      raise SystemExit(f"Unexpected redirect host for {notice_id}: {response.geturl()}")
                  data = response.read(25 * 1024 * 1024 + 1)
              if len(data) > 25 * 1024 * 1024 or not data.startswith(b"%PDF-"):
                  raise SystemExit(f"Invalid or oversized annual notice PDF: {notice_id}")
              digest = hashlib.sha256(data).hexdigest()
              relative = f"data/reference/source_documents/NOTICE-{notice_id}.pdf"
              target = pathlib.Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              if not target.exists() or target.read_bytes() != data:
                  target.write_bytes(data)
                  changed = True
              if row.get("source_document_path", "") != relative or row.get("source_sha256", "") != digest:
                  row["source_document_path"] = relative
                  row["source_sha256"] = digest
                  changed = True
              print(f"{notice_id}: archived {len(data)} bytes sha256={digest}")

          if changed:
              with notice_inventory.open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=notice_fields, lineterminator=chr(10))
                  writer.writeheader()
                  writer.writerows(notice_rows)
              with transition_ledger.open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=transition_fields, lineterminator=chr(10))
                  writer.writeheader()
                  writer.writerows(transition_rows)
              with ledger.open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator=chr(10))
                  writer.writeheader()
                  writer.writerows(rows)
          PY
      - name: Commit archived evidence
        run: |
          if git diff --quiet; then
            echo "All source PDFs and ledger hashes are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference/nifty50_special_membership_events.csv data/reference/nifty50_transition_register.csv data/reference/nifty50_annual_notice_inventory.csv data/reference/source_documents/
          git commit -m "Archive primary Nifty 50 special-membership PDFs"
          # Other scheduled workflows may also commit to main. Retry a
          # fetch/rebase/push cycle instead of failing on a non-fast-forward race.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main commit (attempt ${attempt}/5); retrying."
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Unable to push archived evidence after 5 retries."
          exit 1
