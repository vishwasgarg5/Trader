name: Model Status

on:
  workflow_dispatch:
    inputs:
      refresh_evidence:
        description: "Run the automated NSE evidence refresh and audit"
        required: false
        type: boolean
        default: false
  schedule:
    # 16:00 IST on NSE trading weekdays (after the cash-market close).
    - cron: "30 10 * * 1-5"
    # Weekly NSE evidence refresh (Sunday 08:45 IST).
    - cron: "15 3 * * 0"
  push:
    branches: [main]
    paths:
      - "trader/**"
      - "tests/**"
      - "config/**"
      - "data/reports/**"
      - "data/signals/**"
      - "data/logs/**"
      - "models/**"
      - "requirements.txt"
      - ".github/workflows/model-status.yml"

permissions:
  contents: read

concurrency:
  group: trader-model-status
  cancel-in-progress: true

jobs:
  model-status:
    name: Test and report model status
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Validate saved model, metrics and safety gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import joblib
          import math

          model_path = Path("models/current_model.joblib")
          metrics_path = Path("data/reports/metrics.json")
          gate_path = Path("config/promotion_gate.json")

          if not model_path.is_file() or model_path.stat().st_size == 0:
              raise SystemExit("Saved model is missing or empty")
          artifact = joblib.load(model_path)
          # The training pipeline persists a metadata bundle, not a bare estimator.
          # Accept that documented bundle and retain compatibility with bare estimators.
          if isinstance(artifact, dict):
              model = artifact.get("model")
              features = artifact.get("features")
              if not isinstance(features, list) or not features or not all(
                  isinstance(name, str) and name for name in features
              ):
                  raise SystemExit("Saved model bundle has missing or invalid features")
          else:
              model = artifact
          if not callable(getattr(model, "predict", None)):
              raise SystemExit("Saved model estimator does not expose predict()")
          if not callable(getattr(model, "predict_proba", None)):
              raise SystemExit("Saved model estimator does not expose predict_proba()")

          metrics = json.loads(metrics_path.read_text(encoding="utf-8"))
          for key in ("accuracy", "roc_auc", "brier_score", "baseline_accuracy_majority"):
              value = metrics.get(key)
              if not isinstance(value, (int, float)) or not math.isfinite(value):
                  raise SystemExit(f"Missing or invalid model metric: {key}")

          gate = json.loads(gate_path.read_text(encoding="utf-8"))
          if gate.get("promotion_eligible") is not False:
              raise SystemExit("Safety check failed: promotion_eligible must remain false")
          if gate.get("live_execution_enabled") is not False:
              raise SystemExit("Safety check failed: live_execution_enabled must remain false")

          print(f"Model artifact: loadable ({model_path.stat().st_size} bytes)")
          print(f"Accuracy: {metrics['accuracy']:.4f}")
          print(f"ROC AUC: {metrics['roc_auc']:.4f}")
          print(f"Brier score: {metrics['brier_score']:.4f}")
          print(f"Majority baseline accuracy: {metrics['baseline_accuracy_majority']:.4f}")
          print(f"Promotion gate: {gate.get('status', 'UNKNOWN')}")
          print("Live execution: disabled")
          PY

      - name: Generate diagnostic model status
        run: python -m trader.monitoring --output "${{ runner.temp }}/monitoring.json"

      - name: Add status to workflow summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["RUNNER_TEMP"]) / "monitoring.json"
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not report_path.is_file():
              with summary_path.open("a", encoding="utf-8") as out:
                  out.write("## Model status\n\nMonitoring report was not generated. Check earlier failed steps.\n")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          lines = [
              "## Model status",
              "",
              f"**Status: {report.get('status', 'UNKNOWN')}**",
              "",
              f"- Generated (UTC): {report.get('generated_at_utc', 'unknown')}",
              f"- Code revision: {report.get('code_revision', 'unknown')}",
              f"- Errors: {len(report.get('errors', []))}",
              f"- Warnings: {len(report.get('warnings', []))}",
              "- Promotion eligible: false",
              "- Live execution enabled: false",
              "",
              "### Warnings",
          ]
          lines.extend([f"- {item}" for item in report.get("warnings", [])] or ["- None"])
          lines.extend(["", "### Errors"])
          lines.extend([f"- {item}" for item in report.get("errors", [])] or ["- None"])
          with summary_path.open("a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

      - name: Upload model status reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trader-model-status-${{ github.run_id }}
          path: |
            data/reports/data_integrity.json
            data/reports/metrics.json
            data/signals/latest_signals.csv
            data/logs/predictions.csv
            ${{ runner.temp }}/monitoring.json
          if-no-files-found: warn
          retention-days: 30


  evidence-refresh:
    name: Automated NSE evidence refresh (fail-closed)
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '15 3 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.refresh_evidence == true) ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, '.github/workflows/model-status.yml'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install evidence and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh official NSE Indices archive and source PDFs
        id: discovery
        continue-on-error: true
        run: python -m trader.nifty_notice_discovery

      - name: Rebuild page-level triage and review queue
        id: triage
        if: always()
        continue-on-error: true
        run: python -m trader.nifty_notice_triage

      - name: Audit archive false-negative candidates
        id: archive_audit
        if: always()
        continue-on-error: true
        run: python -m trader.nifty_archive_catalog_audit

      - name: Reconcile inventory, curated register and local PDF hashes
        id: reconciliation
        if: always()
        continue-on-error: true
        run: python -m trader.nifty_notice_reconciliation

      - name: Run fail-closed membership evidence audit
        id: membership_audit
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from trader.membership_evidence import audit_membership_evidence, audit_special_membership_events

          report = {
              "historical_membership": audit_membership_evidence(
                  Path("data/reference/nifty50_transition_register.csv"),
                  Path("data/reference/nifty50_annual_coverage.csv"),
                  Path("."),
              ),
              "special_membership": audit_special_membership_events(
                  Path("data/reference/nifty50_special_membership_events.csv")
              ),
              "policy": "Automated structural and hash checks only. This audit does not independently authenticate exchange facts or create reviewer sign-off.",
          }
          report["ready"] = (
              report["historical_membership"]["ready"]
              and report["special_membership"]["ready"]
          )
          out = Path("data/reports/automated_membership_evidence_audit.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "ready": report["ready"],
              "historical_errors": len(report["historical_membership"]["errors"]),
              "special_event_errors": len(report["special_membership"]["errors"]),
          }, indent=2))
          PY

      - name: Publish evidence refresh summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          files = {
              "discovery": Path("data/reports/nifty50_notice_discovery.json"),
              "triage": Path("data/reports/nifty50_notice_triage.json"),
              "archive_audit": Path("data/reports/nifty50_archive_catalog_audit.json"),
              "reconciliation": Path("data/reports/nifty50_source_reconciliation.json"),
              "membership_audit": Path("data/reports/automated_membership_evidence_audit.json"),
          }
          lines = ["## Automated NSE evidence refresh", "",
                   "This is machine triage and structural validation only; it cannot grant independent verification."]
          for name, path in files.items():
              lines.extend(["", f"### {name.replace('_', ' ').title()}"])
              if not path.is_file():
                  lines.append("- Report unavailable; inspect the corresponding step.")
                  continue
              report = json.loads(path.read_text(encoding="utf-8"))
              for key in ("inventory_rows", "human_review_queue_rows", "catalog_rows_audited",
                          "potential_false_negatives_for_source_review", "register_rows",
                          "register_rows_without_inventory_match", "ready", "coverage_complete"):
                  if key in report:
                      lines.append(f"- {key}: {report[key]}")
              if name == "membership_audit":
                  lines.append(f"- Historical membership errors: {len(report['historical_membership']['errors'])}")
                  lines.append(f"- Special-event errors: {len(report['special_membership']['errors'])}")
          lines.extend(["", "**Promotion: disabled. Live execution: disabled. Research status: HOLD unless separately evidenced.**"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload machine-generated evidence and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trader-nse-evidence-refresh-${{ github.run_id }}
          path: |
            data/reference/nifty50_annual_notice_inventory.csv
            data/reference/nifty50_archive_discovery_catalog.csv
            data/reference/nifty50_notice_register.csv
            data/reference/nifty50_notice_review_queue.csv
            data/reference/nifty50_candidate_events.csv
            data/reference/source_documents/
            data/reference/extracted_notice_text/
            data/reference/ocr_notice_text/
            data/reports/nifty50_notice_discovery.json
            data/reports/nifty50_notice_triage.json
            data/reports/nifty50_archive_catalog_audit.json
            data/reports/nifty50_source_reconciliation.json
            data/reports/nifty50_source_reconciliation.csv
            data/reports/automated_membership_evidence_audit.json
          if-no-files-found: warn
          retention-days: 90
