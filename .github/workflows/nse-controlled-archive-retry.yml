name: NSE controlled curl_cffi archive retry and Wayback CDX

on:
  schedule:
    - cron: "15 2 * * 1"
    - cron: "45 3 * * 3"
    - cron: "15 5 * * 5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nse-controlled-archive-retry.yml"
      - "scripts/nse_curl_cffi_retry.py"
      - "tests/test_nse_curl_cffi_retry.py"
      - "data/reports/weekly_market_document_acquisition.json"
      - "data/reports/weekly_market_document_refresh.json"

permissions:
  contents: write

concurrency:
  group: nse-controlled-archive-retry
  cancel-in-progress: false

jobs:
  controlled-retry-and-cdx:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install clients and test runner
        run: python -m pip install --disable-pip-version-check pytest requests curl_cffi
      - name: Test acquisition safeguards
        run: python -m pytest -q tests/test_nse_curl_cffi_retry.py
      - name: Retry PDFs and ingest Wayback CDX independently
        run: python scripts/nse_curl_cffi_retry.py
      - name: Commit validated source bytes and reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/reference/source_documents/nse_curl_cffi_retry data/reference/wayback_cdx data/reports/nse_curl_cffi_retry.json data/reports/wayback_cdx_ingestion.json
          if git diff --cached --quiet; then
            echo "No validated documents or new CDX metadata"
          else
            git commit -m "Retry NSE archive PDFs with curl_cffi and ingest Wayback CDX"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload retry and CDX reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-curl-cffi-and-wayback-cdx
          path: |
            data/reports/nse_curl_cffi_retry.json
            data/reports/wayback_cdx_ingestion.json
          if-no-files-found: warn
          retention-days: 30
